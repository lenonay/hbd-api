<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBD - Login</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="./admin/public/css/login.css" />
    <script type="module" src="./admin/public/js/login.js"></script>
  </head>
  <body>
    <main>
      <img
        src="./admin/public/images/bahia-logo.webp"
        alt="Logo Hotel Bahia del Duque"
        srcset=""
      />

      <form class="loginForm" action="#" method="POST">
        <h1>Bienvenido</h1>
        <p class="error_display"></p>
        <input type="email" name="email" id="inp_email" placeholder="Email" />
        <input
          type="password"
          name="passwd"
          id="inp_passwd"
          placeholder="Contraseña"
        />
        <button type="button" class="login_button">
          <span>Iniciar sesión</span>
        </button>
      </form>
    </main>
  </body>
</html>
